<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Automate — Package Validation Workflow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');

  :root {
    --paper: #f5f5f5;
    --paper-2: #ececec;
    --ink: #2d3142;
    --muted: #4f5d75;
    --soft: #7a8399;
    --rule: rgba(45,49,66,0.12);
    --rule-solid: #bfc0c0;
    --accent: #eb6c36;
    --accent-tint: rgba(235,108,54,0.08);
    --link: #2e5aa8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Geist', sans-serif;
    display: flex;
    justify-content: center;
    padding: 3rem 2rem;
  }

  .diagram-container {
    max-width: 860px;
    width: 100%;
  }

  .header {
    padding: 0 0 1.5rem 0;
  }

  .eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: 'Instrument Serif', serif;
    font-size: 1.75rem;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.3;
  }

  .subtitle {
    font-family: 'Geist', sans-serif;
    font-size: 0.875rem;
    color: var(--muted);
    margin-top: 0.25rem;
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .footer {
    margin-top: 1.5rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--rule);
    font-family: 'Geist Mono', monospace;
    font-size: 8px;
    color: var(--soft);
    letter-spacing: 0.14em;
  }
</style>
</head>
<body>
<div class="diagram-container">
  <div class="header">
    <p class="eyebrow">Factory · Workflow</p>
    <h1>Check Automate — Package Validation Workflow</h1>
    <p class="subtitle">Nested control blocks: loop_until → foreach → do_until → if_else, with human escalation on exhaustion.</p>
  </div>

  <svg role="img" aria-labelledby="chart-title chart-desc" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
    <title id="chart-title">Check Automate — Package Validation Workflow</title>
    <desc id="chart-desc">Flowchart showing a nested control-block workflow: discover packages via loop_until, then foreach each package run a do_until check loop with an if_else branch — if tests pass, proceed; if they fail, an agent fixes errors up to three iterations before escalating to a human.</desc>

    <defs>
      <!-- Arrow markers -->
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
      <!-- Dot pattern -->
      <pattern id="dots" width="22" height="22" patternUnits="userSpaceUse">
        <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
      </pattern>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ===== ARROWS (drawn before nodes) ===== -->

    <!-- Start → Discover Packages -->
    <path d="M 400,88 V 108" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Discover Packages → Decision: Packages found? -->
    <path d="M 400,188 V 208" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Decision: Packages found? → No → End (right) -->
    <path d="M 520,288 H 600 V 308" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Decision: Packages found? → Yes → Foreach (down) -->
    <path d="M 400,328 V 348" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Foreach → Loop 2 header (Check loop) -->
    <path d="M 400,428 V 448" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Loop 2 header → Check (agent) -->
    <path d="M 400,508 V 528" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Check (agent) → Decision: All pass? -->
    <path d="M 400,588 V 608" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Decision: All pass? → Yes (happy path, accent) → No-Op (right) -->
    <path d="M 520,688 H 600 V 708" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Decision: All pass? → No (down) → Loop 2 exhausted? -->
    <path d="M 400,728 V 748" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- No-Op → Merge dot 1 -->
    <path d="M 600,788 V 828" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Merge dot 1 → Loop 2 exhausted? (decision) -->
    <path d="M 600,848 H 480 V 868" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Loop 2 exhausted? → No → Fix agent (right) -->
    <path d="M 520,948 H 600 V 968" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Loop 2 exhausted? → Yes → Human Escalation (down) -->
    <path d="M 400,988 V 1008" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Fix agent → back to Check (loop back, right side) -->
    <path d="M 640,1028 H 680 V 588 H 480" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="5,4"/>

    <!-- Merge dot 2 (after human) → End (final) -->
    <path d="M 400,1068 V 1080" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Loop 1: Next package → back to Foreach (left side, long return) -->
    <path d="M 320,1028 H 200 V 428 H 320" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="5,4"/>

    <!-- ===== NODES ===== -->

    <!-- Start (oval) -->
    <rect x="340" y="48" width="120" height="40" rx="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Start</text>

    <!-- Discover Packages (rectangle) -->
    <rect x="320" y="128" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <!-- Type tag -->
    <rect x="332" y="134" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="354" y="143" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
    <!-- Node name -->
    <text x="400" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Discover Packages</text>
    <!-- Sublabel -->
    <text x="400" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">loop_until · max 3</text>

    <!-- Decision: Packages found? (diamond) -->
    <polygon points="400,208 520,288 400,368 280,288" fill="rgba(45,49,66,0.05)" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="288" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Packages</text>
    <text x="400" y="302" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">found?</text>

    <!-- "No" label on right branch -->
    <rect x="555" y="278" width="28" height="12" rx="2" fill="#f5f5f5"/>
    <text x="569" y="288" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>

    <!-- "Yes" label on down branch -->
    <rect x="385" y="338" width="30" height="12" rx="2" fill="#f5f5f5"/>
    <text x="400" y="348" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>

    <!-- End (no packages) (oval) -->
    <rect x="640" y="288" width="80" height="40" rx="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="680" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">End</text>

    <!-- Foreach (rectangle) -->
    <rect x="320" y="368" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="332" y="374" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="354" y="383" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FORE</text>
    <text x="400" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Foreach Package</text>
    <text x="400" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">items: &lt;output:packages&gt;</text>

    <!-- Loop 2 header (Check loop) -->
    <rect x="320" y="448" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="332" y="454" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="354" y="463" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
    <text x="400" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Check Loop</text>
    <text x="400" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">do_until · max 3</text>

    <!-- Check (agent) — focal: coral accent -->
    <rect x="320" y="548" width="160" height="40" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <rect x="332" y="554" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
    <text x="350" y="563" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
    <text x="400" y="574" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run Check</text>
    <text x="400" y="588" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">just check {{pkg}}</text>

    <!-- Decision: All pass? (diamond) — focal -->
    <polygon points="400,608 520,688 400,768 280,688" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="400" y="688" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">All tests</text>
    <text x="400" y="702" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pass?</text>

    <!-- "Yes" label on happy path -->
    <rect x="555" y="678" width="30" height="12" rx="2" fill="#f5f5f5"/>
    <text x="570" y="688" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>

    <!-- "No" label on down branch -->
    <rect x="385" y="738" width="30" height="12" rx="2" fill="#f5f5f5"/>
    <text x="400" y="748" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>

    <!-- No-Op (bash) — accent tint (happy path) -->
    <rect x="520" y="708" width="160" height="80" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.5)" stroke-width="1"/>
    <rect x="532" y="714" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.4)" stroke-width="0.8"/>
    <text x="548" y="723" fill="rgba(235,108,54,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BASH</text>
    <text x="600" y="744" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">No-Op Pass</text>
    <text x="600" y="760" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">echo "no-op"</text>
    <text x="600" y="776" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">skip to next iter</text>

    <!-- Merge dot 1 (after no-op, before loop 2 exhausted) -->
    <circle cx="600" cy="840" r="4" fill="#2d3142"/>

    <!-- Loop 2 exhausted? (diamond) -->
    <polygon points="400,868 520,948 400,1028 280,948" fill="rgba(45,49,66,0.05)" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="948" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Loop 2</text>
    <text x="400" y="962" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">exhausted?</text>

    <!-- "No" label on fix branch -->
    <rect x="555" y="938" width="28" height="12" rx="2" fill="#f5f5f5"/>
    <text x="569" y="948" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>

    <!-- "Yes" label on human branch -->
    <rect x="385" y="988" width="30" height="12" rx="2" fill="#f5f5f5"/>
    <text x="400" y="998" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>

    <!-- Fix Agent (agent) — coral accent for consequential branch -->
    <rect x="520" y="968" width="160" height="80" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.5)" stroke-width="1"/>
    <rect x="532" y="974" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.4)" stroke-width="0.8"/>
    <text x="550" y="983" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
    <text x="600" y="1004" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run Fix Agent</text>
    <text x="600" y="1020" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read docs, fix errors</text>

    <!-- Human Escalation (rectangle) -->
    <rect x="320" y="1008" width="160" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <rect x="332" y="1014" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="358" y="1023" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ESCALATE</text>
    <text x="400" y="1044" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Human Escalation</text>
    <text x="400" y="1060" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">involve the human</text>

    <!-- Final End (oval) -->
    <rect x="340" y="1088" width="120" height="40" rx="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="1112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Done</text>

    <!-- ===== LABELS ===== -->

    <!-- Loop 1 label (left side, long return arrow annotation) -->
    <rect x="170" y="228" width="48" height="12" rx="2" fill="#f5f5f5"/>
    <text x="194" y="238" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NEXT PKG</text>

    <!-- Loop 2 label (left side, fix→check return arrow annotation) -->
    <rect x="690" y="428" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="718" y="438" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RETRY</text>

    <!-- Legend strip -->
    <line x1="30" y1="1142" x2="770" y2="1142" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="144" y="1158" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <!-- Legend items -->
    <rect x="220" y="1148" width="16" height="12" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="244" y="1158" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Start / End</text>

    <rect x="350" y="1148" width="16" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="1"/>
    <text x="374" y="1158" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Step</text>

    <polygon points="360,1160 372,1168 360,1176 348,1168" fill="rgba(45,49,66,0.05)" stroke="#2d3142" stroke-width="1"/>
    <text x="398" y="1158" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Decision</text>

    <circle cx="530" cy="1158" r="4" fill="#2d3142"/>
    <text x="544" y="1158" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Merge</text>

    <line x1="600" y1="1155" x2="640" y2="1155" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="650" y="1158" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace">Focal path</text>

    <line x1="720" y1="1155" x2="760" y2="1155" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="770" y="1158" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Retry</text>

  </svg>

  <div class="footer">
    nexus-tui-awesome · factory engine · check-automate workflow
  </div>
</div>
</body>
</html>
