name: joke-aggregator

# User provides the joke category as input
inputs:
  - name: category
    description: "The type of joke to generate"
    default: "programming"

# Parallel block: spawn two agents simultaneously, each getting the same input
control:
  - type: parallel
    id: joke-generation
    steps:
      - id: agent-1
        type: agent
        agent: pi
        command: "One programming joke, 1 sentence max."
        output: joke-1

      - id: agent-2
        type: agent
        agent: pi
        command: "Another programming joke, 1 sentence max."
        output: joke-2

# Final step: display both jokes
steps:
  - id: display
    type: bash
    command: 'echo "Joke 1: <output:agent-1>\n\nJoke 2: <output:agent-2>"'
